# ---------------------------------------------------------------------------
# Zero-Trust Supply Chain — secure build & sign pipeline
# Author: Nour El Houda Bouajila (https://github.com/nourhb)
#
# Every image built here is:
#   1. Built with full SLSA provenance metadata (build service attestation)
#   2. Signed with Cosign in KEYLESS mode (Fulcio + Rekor via GitHub OIDC)
#   3. Attested with SLSA provenance + SBOM (Syft), both signed
#   4. Scanned with Trivy (fails the pipeline on CRITICAL vulnerabilities)
#
# The cluster (see kyverno/) verifies all of this at admission time.
# ---------------------------------------------------------------------------

name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # OIDC token for keyless Cosign signing (Fulcio) — no long-lived keys.
  id-token: write
  # Push images to GHCR and write attestations.
  contents: read
  packages: write
  # Upload Trivy SARIF results to code scanning.
  security-events: write
  # Write SLSA provenance attestations.
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/demo-app
  COSIGN_VERSION: v2.4.1
  SYFT_VERSION: v1.17.0

jobs:
  build-sign-attest:
    name: Build, sign & attest
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Immutable tags: branch SHA + run id. Never rely on :latest.
          tags: |
            type=sha,prefix=,format=long
            type=raw,value=run-${{ github.run_id }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: app/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Full provenance: records builder identity, source repo, and
          # build inputs in the image config for SLSA attestation.
          provenance: true
          sbom: false # SBOM is generated explicitly with Syft below.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image (keyless)
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "Signing ${IMAGE} with keyless Cosign (Fulcio + Rekor)..."
          # Keyless: the signing certificate is issued by Fulcio after
          # verifying the GitHub OIDC identity; the signature is logged
          # in the Rekor transparency log. No private keys to manage.
          cosign sign --yes "${IMAGE}"

      - name: Generate SLSA provenance attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Generate and sign SBOM
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "Generating SBOM with Syft..."
          syft "${IMAGE}" -o spdx-json=sbom.spdx.json
          echo "Attesting SBOM..."
          # The SBOM attestation is itself signed and stored in Rekor,
          # binding the dependency list to this exact image digest.
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE}"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          # Zero-trust means we refuse to ship known-critical CVEs.
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Verify everything (defense in depth)
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "Verifying signature..."
          cosign verify \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}"
          echo "Verifying SLSA attestation..."
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/supply-chain.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}"
          echo "All supply-chain artifacts verified."

      - name: Report image digest
        if: github.event_name == 'push'
        run: |
          echo "## Secure image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this digest in your manifests (see kubernetes/):" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
