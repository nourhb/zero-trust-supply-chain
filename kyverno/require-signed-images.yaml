# ---------------------------------------------------------------------------
# Zero-Trust Supply Chain — Kyverno ClusterPolicy: require signed images
# Author: Nour El Houda Bouajila (https://github.com/nourhb)
#
# ATTACK PREVENTED: image tampering / malicious image substitution.
# An attacker who compromises a registry (or a developer workstation) could
# push a trojaned image under a trusted name. Without signature verification,
# Kubernetes would happily run it. This policy makes the cluster verify, at
# admission time, that every image was signed by OUR CI pipeline (keyless
# Cosign via GitHub OIDC) and that the signature is recorded in Rekor.
#
# Keyless trust model:
#   - Fulcio (certificate authority) issues a short-lived certificate only
#     after verifying the GitHub Actions OIDC identity of the signer.
#   - Rekor (transparency log) records the signature publicly, so a
#     compromised Fulcio cannot silently issue rogue certificates.
#   - Kyverno checks: valid Fulcio chain + expected OIDC subject/issuer +
#     signature present in Rekor.
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All container images must carry a valid keyless Cosign signature issued
      to this repository's CI workflow, logged in Rekor.
spec:
  # Enforce: unsigned or badly-signed Pods are REJECTED, not just reported.
  validationFailureAction: Enforce
  # Admission-time check only; background scans would just duplicate Rekor.
  background: false
  rules:
    - name: verify-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageRefs:
            # Scope: only images from this project's registry namespace.
            # Adjust if you publish under a different org/user.
            - "ghcr.io/nourhb/*"
          attestors:
            - entries:
                - certificates:
                    # Fulcio root certificate chain (fetched from
                    # https://fulcio.sigstore.dev/api/v1/rootCert).
                    # Rotate if Sigstore rotates its PKI; see docs/how-it-works.md.
                    certificateChain: |
