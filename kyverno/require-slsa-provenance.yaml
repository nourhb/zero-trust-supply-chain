                        subject: "https://github.com/nourhb/zero-trust-supply-chain/.github/workflows/supply-chain.yaml@refs/heads/main"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    # The image must have been built by GitHub-hosted Actions
                    # runners — not a self-hosted runner an attacker controls.
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: "https://github.com/actions/runner/github-hosted"
                    # ...from this exact repository.
                    - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
                      operator: Equals
                      value: "https://github.com/nourhb/zero-trust-supply-chain"
