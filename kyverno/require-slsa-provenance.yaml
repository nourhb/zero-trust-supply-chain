# ---------------------------------------------------------------------------
# Zero-Trust Supply Chain — Kyverno ClusterPolicy: require SLSA provenance
# Author: Nour El Houda Bouajila (https://github.com/nourhb)
#
# ATTACK PREVENTED: CI/build-system compromise and "it was built on my
# laptop" claims. A signature alone proves WHO signed, not HOW the image was
# built. An attacker with CI access could build a malicious image through the
# legitimate pipeline and get a valid signature for it.
#
# SLSA provenance attestation records the build: source repo, commit SHA,
# builder identity (GitHub Actions), and build parameters. This policy
# requires that attestation to exist and verifies it was signed by the same
# trusted CI identity — so you know exactly which source produced the image.
# ---------------------------------------------------------------------------
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-slsa-provenance
  annotations:
    policies.kyverno.io/title: Require SLSA Provenance
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All container images must carry a signed SLSA provenance attestation
      proving they were built by the trusted CI pipeline from a known source.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: verify-slsa-attestation
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageRefs:
            - "ghcr.io/nourhb/*"
          attestations:
            - name: slsa-provenance
              # SLSA v1 provenance, as produced by actions/attest-build-provenance.
              predicateType: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - certificates:
                        # Same Fulcio chain as require-signed-images: the
                        # attestation must be signed by our CI identity.
