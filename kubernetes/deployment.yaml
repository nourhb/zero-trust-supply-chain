# ---------------------------------------------------------------------------
# Zero-Trust Supply Chain — demo deployment, pinned BY DIGEST
# Author: Nour El Houda Bouajila (https://github.com/nourhb)
#
# HOW TO USE:
#   1. Run the pipeline once (.github/workflows/supply-chain.yaml).
#   2. Copy the digest printed in the "Report image digest" step summary.
#   3. Replace DIGEST_PLACEHOLDER below with the real sha256 digest.
#   4. kubectl apply -f kubernetes/
#
# WHY A DIGEST, NOT A TAG:
#   Tags are mutable — anyone with registry write access can repoint
#   `demo-app:v1` at different bytes. A digest is content-addressed:
#   sha256:abc... ALWAYS means the exact same bytes. Combined with the
#   Kyverno policies, this guarantees the cluster only runs the exact
#   image your signed, attested pipeline produced.
# ---------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: supply-chain-demo
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/part-of: zero-trust-supply-chain
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          # >>> REPLACE the digest below with your pipeline's output <<<
          # Example: ghcr.io/nourhb/zero-trust-supply-chain/demo-app@sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
          image: ghcr.io/nourhb/zero-trust-supply-chain/demo-app@sha256:DIGEST_PLACEHOLDER
          ports:
            - containerPort: 3000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
